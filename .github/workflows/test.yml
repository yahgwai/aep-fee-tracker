name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip CI for release commits to save resources
    if: |
      github.event_name != 'push' || 
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm audit --audit-level=moderate
    - run: npm run lint
    - run: npm run format:check
    - run: npm run typecheck
    - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    # Skip CI for release commits to save resources
    if: |
      github.event_name != 'push' || 
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        if [ -z "${{ secrets.ARBITRUM_NOVA_RPC_URL }}" ]; then
          echo "Error: ARBITRUM_NOVA_RPC_URL secret is not set in GitHub repository settings"
          echo "Please add the ARBITRUM_NOVA_RPC_URL secret in Settings → Secrets and variables → Actions"
          exit 1
        fi
        echo "# RPC URLs for testing" > .env
        echo "ARBITRUM_NOVA_RPC_URL=${{ secrets.ARBITRUM_NOVA_RPC_URL }}" >> .env

    - name: Debug .env file
      run: |
        echo "Checking .env file was created:"
        ls -la .env
        echo "Number of lines in .env:"
        wc -l .env
        echo "Checking environment variable is set:"
        if [ -n "${ARBITRUM_NOVA_RPC_URL}" ]; then
          echo "ARBITRUM_NOVA_RPC_URL is set (value hidden)"
        else
          echo "ARBITRUM_NOVA_RPC_URL is NOT set"
        fi

    - name: Run tests
      run: npm test
      timeout-minutes: 2
      env:
        ARBITRUM_NOVA_RPC_URL: ${{ secrets.ARBITRUM_NOVA_RPC_URL }}

    - name: Test completed
      run: echo "Tests completed successfully!"