name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip CI for release commits to save resources
    if: |
      github.event_name != 'push' || 
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm audit --audit-level=moderate
    - run: npm run lint
    - run: npm run format:check
    - run: npm run typecheck
    - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    # Skip CI for release commits to save resources
    if: |
      github.event_name != 'push' || 
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run tests
      run: npm test
      timeout-minutes: 2
      env:
        ARBITRUM_NOVA_RPC_URL: ${{ secrets.ARBITRUM_NOVA_RPC_URL }}

    - name: Test completed
      run: echo "Tests completed successfully!"